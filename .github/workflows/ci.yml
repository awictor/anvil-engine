name: CI

# Locks the build + Chrome-free test suite green on every push/PR. The default
# `npm test` excludes test/e2e (which launches real Chrome) via vitest.config.ts,
# so this runs on a bare CI runner with no browser. anvil-engine is the shared
# engine Relay + the DataFaucet migration both depend on — a green gate here
# protects both.
on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
